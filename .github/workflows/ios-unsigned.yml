name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-unsigned.yml'
      - 'tools/build_ios_unsigned.sh'
      - 'tools/verify_ios_ipa.py'
      - 'export_presets.cfg'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iPhone and iPad IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and iOS templates
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/emberkeep-godot"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mkdir -p "$download_dir" "$template_dir" "$download_dir/bin"
          base_url="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
            "$base_url/Godot_v4.7.2-stable_macos.universal.zip" -o "$download_dir/editor.zip"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
            "$base_url/Godot_v4.7.2-stable_export_templates.tpz" -o "$download_dir/templates.tpz"
          # SHA-256 digests from the official 4.7.2 release asset metadata.
          (cd "$download_dir" && shasum -a 256 --check <<'CHECKSUMS'
          c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  editor.zip
          f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz
          CHECKSUMS
          )
          unzip -q "$download_dir/editor.zip" -d "$download_dir"
          unzip -q -j "$download_dir/templates.tpz" 'templates/ios.zip' -d "$template_dir"
          ln -s "$download_dir/Godot.app/Contents/MacOS/Godot" "$download_dir/bin/godot"
          echo "$download_dir/bin" >> "$GITHUB_PATH"
      - name: Run gameplay and interface checks
        run: bash tools/test.sh
      - name: Export, build without signing, and verify IPA
        run: bash tools/build_ios_unsigned.sh "$RUNNER_TEMP/emberkeep-ios-output"
      - name: Upload sideloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Emberkeep-iOS-unsigned
          path: |
            ${{ runner.temp }}/emberkeep-ios-output/Emberkeep-unsigned.ipa
            ${{ runner.temp }}/emberkeep-ios-output/Emberkeep-unsigned.ipa.sha256
            ${{ runner.temp }}/emberkeep-ios-output/build-info.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload diagnostics if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-diagnostics
          path: ${{ runner.temp }}/emberkeep-ios-output/*.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Describe installation
        shell: bash
        run: |
          {
            echo "### Emberkeep iOS build"
            echo "Download the **Emberkeep-iOS-unsigned** artifact below and extract **Emberkeep-unsigned.ipa**."
            echo "Sign and install it using AltStore Classic or SideStore with your own Apple ID."
            echo "This build contains no Apple credentials or provisioning profiles."
            echo "Free-account signing needs renewal within seven days. Physical-device gameplay is not tested by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
