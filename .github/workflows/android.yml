name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'tools/export_android.sh'
      - 'tools/configure_android.gd'
      - 'tools/verify_android_apk.py'

permissions:
  contents: read

# Serialize first-time signing-key creation as well as repeat exports.
concurrency:
  group: android-debug-${{ github.repository }}
  cancel-in-progress: false

jobs:
  export:
    name: Export and verify Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android export tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.1.0'

      - name: Restore Godot 4.7.2 and Android template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-4.7.2-android
          key: godot-4.7.2-linux-android-template-v1

      - name: Download and verify official Godot files
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          download_dir="$RUNNER_TEMP/emberkeep-godot-android"
          godot_dir="$HOME/godot-4.7.2-android"
          mkdir -p "$download_dir" "$godot_dir/templates"
          base_url='https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable'
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
            "$base_url/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$download_dir/editor.zip"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 \
            "$base_url/Godot_v4.7.2-stable_export_templates.tpz" -o "$download_dir/templates.tpz"
          # SHA-512 values from the official 4.7.2 SHA512-SUMS.txt.
          (cd "$download_dir" && sha512sum --check <<'CHECKSUMS'
          9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  editor.zip
          ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  templates.tpz
          CHECKSUMS
          )
          unzip -q -j "$download_dir/editor.zip" 'Godot_v4.7.2-stable_linux.x86_64' -d "$godot_dir"
          mv "$godot_dir/Godot_v4.7.2-stable_linux.x86_64" "$godot_dir/godot"
          chmod +x "$godot_dir/godot"
          unzip -q -j "$download_dir/templates.tpz" 'templates/android_debug.apk' 'templates/version.txt' -d "$godot_dir/templates"

      - name: Install Godot template
        shell: bash
        run: |
          set -euo pipefail
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          cp "$HOME/godot-4.7.2-android/templates/"* "$template_dir/"
          echo "$HOME/godot-4.7.2-android" >> "$GITHUB_PATH"

      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emberkeep-android/.local-signing
          key: emberkeep-android-debug-signing-v1

      - name: Run gameplay and rendering-policy checks
        run: bash tools/test.sh

      - name: Assign APK build version
        shell: bash
        env:
          APK_BUILD_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          build = 100000 + int(os.environ['APK_BUILD_CODE'])
          path = Path('export_presets.cfg')
          text = path.read_text()
          assert text.count('version/code=1\n') == 1
          assert text.count('version/name="0.2.0"') == 1
          text = text.replace('version/code=1\n', f'version/code={build}\n')
          text = text.replace('version/name="0.2.0"', f'version/name="0.2.0-android.{build}"')
          path.write_text(text)
          PY

      - name: Export signed debug APK
        run: bash tools/export_android.sh "$RUNNER_TEMP/emberkeep-android/Emberkeep-Android.apk"

      - name: Verify the APK
        shell: bash
        run: |
          python3 tools/verify_android_apk.py \
            "$RUNNER_TEMP/emberkeep-android/Emberkeep-Android.apk" \
            --aapt "$ANDROID_HOME/build-tools/36.1.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.1.0/apksigner" \
            --zipalign "$ANDROID_HOME/build-tools/36.1.0/zipalign" \
            --godot godot \
            --output-dir "$RUNNER_TEMP/emberkeep-android/verification"

      - name: Upload APK and verification report
        uses: actions/upload-artifact@v4
        with:
          name: Emberkeep-Android
          path: |
            ${{ runner.temp }}/emberkeep-android/Emberkeep-Android.apk
            ${{ runner.temp }}/emberkeep-android/verification/*.json
            ${{ runner.temp }}/emberkeep-android/verification/*.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Prepare a separately installable Preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('export_presets.cfg')
          text = path.read_text()
          assert text.count('package/unique_name="org.emberkeep.game"') == 1
          assert text.count('package/name="Emberkeep"') == 1
          text = text.replace('package/unique_name="org.emberkeep.game"', 'package/unique_name="org.emberkeep.preview"')
          text = text.replace('package/name="Emberkeep"', 'package/name="Emberkeep Preview"')
          path.write_text(text)
          PY

      - name: Export signed Preview APK
        run: bash tools/export_android.sh "$RUNNER_TEMP/emberkeep-android/Emberkeep-Preview.apk"

      - name: Verify the Preview APK
        shell: bash
        run: |
          python3 tools/verify_android_apk.py \
            "$RUNNER_TEMP/emberkeep-android/Emberkeep-Preview.apk" \
            --expected-package org.emberkeep.preview \
            --aapt "$ANDROID_HOME/build-tools/36.1.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.1.0/apksigner" \
            --zipalign "$ANDROID_HOME/build-tools/36.1.0/zipalign" \
            --godot godot \
            --output-dir "$RUNNER_TEMP/emberkeep-android/verification-preview"

      - name: Upload separately installable Preview
        uses: actions/upload-artifact@v4
        with:
          name: Emberkeep-Preview
          path: |
            ${{ runner.temp }}/emberkeep-android/Emberkeep-Preview.apk
            ${{ runner.temp }}/emberkeep-android/verification-preview/*.json
            ${{ runner.temp }}/emberkeep-android/verification-preview/*.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Android-build-diagnostics
          path: ${{ runner.temp }}/emberkeep-android/verification*/*.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Describe the build
        shell: bash
        run: |
          {
            echo '### Emberkeep Android APK'
            echo 'Download **Emberkeep-Android**, unzip it, and install **Emberkeep-Android.apk**.'
            echo 'If an older diagnostic build conflicts, download **Emberkeep-Preview** instead. It installs as a separate app and leaves the existing installation and saves alone; it starts with its own progress.'
            echo "Source commit: $GITHUB_SHA"
            echo 'This development APK uses a cached debug signing key. Earlier diagnostic APKs may have a different certificate and cannot necessarily be updated in place.'
            echo 'The PowerVR safeguard is included. Stability on the Pixel 10 still needs an on-device run.'
          } >> "$GITHUB_STEP_SUMMARY"
